; PlatformIO Project Configuration File
;
; ──────────────────────────────────────────────
;  j4_display_v0_1 / SeeedStudio XIAO ESP32S3
;  Secondary display board for Johnny 4 controller
;  Receives data from TTGO T-Display v1.1 over UART
;  Drives 3.5" ILI9488 480x320 SPI TFT
; ──────────────────────────────────────────────
[env:xiao-esp32s3]
platform    = espressif32
board       = seeed_xiao_esp32s3
framework   = arduino

monitor_speed = 115200
upload_speed         = 921600
upload_protocol      = esp-builtin

build_flags =
  ; USB CDC as Serial (debug), leaves UART0 hardware pins free
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; TFT_eSPI — ILI9488 @ 480x320
  -DUSER_SETUP_LOADED
  -DILI9488_DRIVER
  -DTFT_WIDTH=320
  -DTFT_HEIGHT=480
  -DTFT_MISO=8
  -DTFT_MOSI=9
  -DTFT_SCLK=7
  -DTFT_CS=4
  -DTFT_DC=3
  -DTFT_RST=2
  -DTFT_BL=1
  -DTFT_BACKLIGHT_ON=HIGH
  -DSPI_FREQUENCY=27000000
  -DSPI_READ_FREQUENCY=20000000
  -DLOAD_GLCD
  -DLOAD_FONT2
  -DLOAD_FONT4
  -DLOAD_FONT6
  -DLOAD_FONT7
  -DLOAD_FONT8
  -DLOAD_GFXFF
  -DSMOOTH_FONT

lib_deps =
  https://github.com/Bodmer/TFT_eSPI.git
